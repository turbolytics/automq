# Every scenario: MinIO, Toxiproxy and three AutoMQ servers start; two
# idempotent producers send numbered values to every partition and write a
# ledger line for each send's outcome; the faults run while they send. Then
# the oracle reads every partition back and decides each claim
# (temper/recipe/oracle/oracle/verdict.py). Each `check` pair is
# reference=metric.
#
#   temper scenarios run --scenario <id> --build
#
- id: automq.s3_slow
  runner: temper
  name: Slow S3 delays writes but loses, duplicates and reorders none
  description: >
    Every S3 edge answers 2 s late for 30 s, then 5 s late for 20 s. WAL
    uploads retry quickly (fast retry), so a slow upload may be sent twice.
  compose: temper/compose.yml
  subject: automq
  covers: [ack.never_lost, idempotence.no_duplicates, order.per_partition, failed.stays_failed, log.no_phantoms]
  seed: 31
  events:
    - up: {minio: 1, toxiproxy: 1}
    - buckets: []
    - up: {server1: 1, server2: 1, server3: 1}
    - wait_until: {oracle: [ready], equals: "3", timeout: 180s}
    - oracle: [setup, "{subject}"]
    - hold: {name: writer, oracle: [write, "{subject}", "100"]}   # the producers send for 100 s
    - sleep: 10s
    - check: {covers: ack.never_lost, oracle: [writing, "{subject}"]}   # still sending, or the faults below test nothing
    - s3_edge: [s3_slow, all, slow, "2000"]
    - sleep: 30s
    - s3_edge: [s3_slow, all, restore]
    - s3_edge: [s3_slow, all, slow, "5000"]
    - sleep: 20s
    - s3_edge: [s3_slow, all, restore]
    - wait_until: {oracle: [writing, "{subject}"], equals: "1", timeout: 5m}
    - check:
        results:
          oracle: [check, "{subject}", "ack.never_lost=lost", "idempotence.no_duplicates=dups", "order.per_partition=order", "failed.stays_failed=resurrected", "log.no_phantoms=unexpected"]
          decides: [ack.never_lost, idempotence.no_duplicates, order.per_partition, failed.stays_failed, log.no_phantoms]
