# Every scenario: MinIO, Toxiproxy and three AutoMQ servers start; two
# idempotent producers send numbered values to every partition and write a
# ledger line for each send's outcome; the faults run while they send. Then
# the oracle reads every partition back and decides each claim
# (temper/recipe/oracle/oracle/verdict.py). Each `check` pair is
# reference=metric.
#
#   temper scenarios run --scenario <id> --build
#
- id: automq.baseline
  runner: temper
  name: With nothing failing, every acknowledged write is stored once, in order
  description: >
    No faults. The run every fault scenario is compared with.
  compose: temper/compose.yml
  subject: automq
  covers: [ack.never_lost, idempotence.no_duplicates, order.per_partition, failed.stays_failed, log.no_phantoms, storage.s3_wal, producer.idempotent]
  seed: 1
  events:
    - up: {minio: 1, toxiproxy: 1}
    - buckets: []
    - up: {server1: 1, server2: 1, server3: 1}
    - wait_until: {oracle: [ready], equals: "3", timeout: 180s}
    - oracle: [setup, "{subject}"]
    - hold: {name: writer, oracle: [write, "{subject}", "45"]}   # the producers send for 45 s
    - sleep: 10s
    - wait_until: {oracle: [writing, "{subject}"], equals: "1", timeout: 5m}
    - check:
        results:
          oracle: [check, "{subject}", "ack.never_lost=lost", "idempotence.no_duplicates=dups", "order.per_partition=order", "failed.stays_failed=resurrected", "log.no_phantoms=unexpected", "storage.s3_wal=lost", "producer.idempotent=dups+order"]
          decides: [ack.never_lost, idempotence.no_duplicates, order.per_partition, failed.stays_failed, log.no_phantoms, storage.s3_wal, producer.idempotent]
